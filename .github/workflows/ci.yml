name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cuda_archs:
        description: "FLASH_ATTN_CUDA_ARCHS to build (semicolon-separated; empty = upstream default 80;90;100;120)"
        required: false
        default: "80"
      max_jobs:
        description: "MAX_JOBS (parallel nvcc invocations)"
        required: false
        default: "2"
      nvcc_threads:
        description: "NVCC_THREADS (internal nvcc parallelism per job)"
        required: false
        default: "1"

jobs:
  eval:
    name: Evaluate flake & derivation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix flake check (evaluation only)
        run: nix flake check --no-build -L
      - name: Evaluate package
        run: nix eval .#packages.x86_64-linux.default.drvPath
      - name: Resolve full build graph
        run: nix build .#flash-attn --dry-run

  build:
    name: Build & test (CUDA, archs=${{ inputs.cuda_archs || '80' }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CUDA_ARCHS: ${{ inputs.cuda_archs }}
      MAX_JOBS_REQ: ${{ inputs.max_jobs }}
      NVCC_THREADS_REQ: ${{ inputs.nvcc_threads }}
    steps:
      - uses: actions/checkout@v4

      # Hosted runners only have ~14 GiB free out of the box; the CUDA closure
      # (nvcc, cuDNN, cuBLAS, torch-bin, kernel objects) peaks around 35-40 GiB.
      - name: Free disk space
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af 2>/dev/null || true
          sudo docker builder prune -af 2>/dev/null || true
          sudo apt-get clean || true
          df -h / | tee disk-after-cleanup.txt
          free -h | tee -a disk-after-cleanup.txt

      - name: Ensure swap headroom
        run: |
          set -x
          free -h; swapon --show || true
          AVAIL_KB=$(df --output=avail -k / | tail -1)
          SWAP_KB=$(awk '/SwapTotal/ {print $2}' /proc/meminfo)
          if [ "${SWAP_KB:-0}" -lt 4000000 ] && [ "${AVAIL_KB:-0}" -gt 30000000 ]; then
            sudo dd if=/dev/zero of=/swapfile-nix bs=1M count=6144
            sudo chmod 600 /swapfile-nix
            sudo mkswap /swapfile-nix
            sudo swapon /swapfile-nix || true
          fi
          free -h

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            auto-optimise-store = true

      - name: Prepare nix expressions
        run: |
          set -x
          ARCH_LIST=$(python3 -c 'import os; v=os.environ["CUDA_ARCHS"]; print("null" if not v.strip() else "[ " + " ".join("\"%s\"" % a for a in v.split(";") if a) + " ]")')
          ARCH_TAG=$(echo "${CUDA_ARCHS:-default}" | tr ';,' '--')
          PKGS_PRELUDE='let flake = builtins.getFlake (toString ./.); pkgs = import flake.inputs.nixpkgs { system = "x86_64-linux"; config.allowUnfree = true; overlays = [ flake.overlays.default ]; }; in'
          {
            echo "ARCH_TAG=$ARCH_TAG"
            echo "TORCH_EXPR=$PKGS_PRELUDE pkgs.python3Packages.flash-attn.torch"
            echo "FA_EXPR=$PKGS_PRELUDE pkgs.mkFlashAttn { cudaArchs = $ARCH_LIST; maxJobs = $MAX_JOBS_REQ; nvccThreads = $NVCC_THREADS_REQ; }"
          } >> "$GITHUB_ENV"
          echo "cudaArchs = $ARCH_LIST | maxJobs = $MAX_JOBS_REQ | nvccThreads = $NVCC_THREADS_REQ"

      # Build torch-bin (+ its CUDA redistributable closure) first: the biggest
      # download/patchelf phase, isolated so failures are attributable.
      - name: Build torch-bin (cu130 wheel + CUDA 13 redistributables)
        run: |
          set -o pipefail
          nix build -L --print-build-logs --impure --expr "$TORCH_EXPR" -o result-torch 2>&1 | tee torch-bin-build.log
          df -h /
          nix path-info -sh ./result-torch | tee -a disk-after-cleanup.txt

      - name: Build flash-attn (compiles CUDA kernels; expect hours)
        run: |
          set -o pipefail
          nix build -L --print-build-logs --show-trace --impure --expr "$FA_EXPR" -o result 2>&1 | tee build-full.log
          df -h /
          tail -c 20000000 build-full.log > build.log
          echo "### Build finished" >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect result
        run: |
          nix path-info -shR ./result | tail -3
          du -sh ./result
          find -L ./result -name "*.so" | head
          nix path-info -sh ./result > path-info.txt
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os
          print("- store path:", os.path.realpath("result"))
          print("- cudaArchs:", repr(os.environ["CUDA_ARCHS"]))
          EOF

      - name: Import test (no GPU needed)
        run: |
          nix build --no-link --impure \
            --expr "
              let
                flake = builtins.getFlake (toString ./.);
                pkgs = import flake.inputs.nixpkgs {
                  system = \"x86_64-linux\";
                  config.allowUnfree = true;
                  overlays = [ flake.overlays.default ];
                };
                fa = pkgs.mkFlashAttn {
                  cudaArchs = $(python3 -c 'import os; v=os.environ["CUDA_ARCHS"]; print("null" if not v.strip() else "[ " + " ".join("\"%s\"" % a for a in v.split(";") if a) + " ]")');
                  maxJobs = $MAX_JOBS_REQ;
                  nvccThreads = $NVCC_THREADS_REQ;
                };
              in pkgs.python3.withPackages (ps: [ fa ])
            " -o pyenv
          ./pyenv/bin/python tests/import-test.py 2>&1 | tee import-test.log

      - name: Upload logs & artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-arch-${{ env.ARCH_TAG || 'default' }}
          path: |
            build.log
            import-test.log
            path-info.txt
          retention-days: 30
