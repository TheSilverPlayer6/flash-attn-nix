name: CI

on:
  push:
  pull_request:

jobs:
  eval:
    name: Evaluate flake & derivation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix flake check (evaluation only)
        run: nix flake check --no-build -L
      - name: Evaluate package
        run: nix eval .#packages.x86_64-linux.default.drvPath
      - name: Resolve full build graph
        run: nix build .#flash-attn --dry-run

  # NOTE: actually compiling flash-attn's CUDA kernels needs a big builder
  # (>= 32 GiB RAM recommended) and hours of CPU time, which GitHub-hosted
  # runners cannot provide. The package was verified by building it end to
  # end and running tests/smoke-test.py on an H100 machine; see README.
